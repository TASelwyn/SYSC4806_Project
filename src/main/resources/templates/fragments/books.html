<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="grid(books)" class="book-grid">
    <p th:if="${#lists.isEmpty(books)}">No books found.</p>
    <div th:each="book : ${books}" class="book-card">
        <h3><a th:href="@{/books/{id}(id=${book.id})}" th:text="${book.title}">Title</a></h3>
        <p class="author" th:text="${book.author}">Author</p>
        <p class="price" th:text="'$' + ${#numbers.formatDecimal(book.price, 1, 2)}">$0.00</p>
        <th:block th:replace="~{fragments/books :: stock(${book.stockQuantity})}"></th:block>
    </div>
</div>

<th:block th:fragment="stock(qty)">
    <span th:if="${qty > 0}" class="stock in-stock" th:text="|In stock (${qty} left)|">In stock</span>
    <span th:if="${qty <= 0}" class="stock out-of-stock">Out of stock</span>
</th:block>

</body>
</html>
