<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Amazin Bookstore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container">
    <a th:href="@{/books}">← Back to all books</a>
    <article class="book-detail">
        <img th:if="${book.imageUrl}" th:src="${book.imageUrl}" th:alt="${book.title}">
        <div>
            <h1 th:text="${book.title}">Title</h1>
            <p class="author">by <span th:text="${book.author}">Author</span></p>
            <p class="price" th:text="'$' + ${#numbers.formatDecimal(book.price, 1, 2)}">$0.00</p>
            <th:block th:replace="~{fragments/books :: stock(${book.stockQuantity})}"></th:block>
            <dl>
                <dt>ISBN</dt>      <dd th:text="${book.isbn}"></dd>
                <dt>Publisher</dt> <dd th:text="${book.publisher} ?: 'Unknown'"></dd>
            </dl>
            <p th:text="${book.description}"></p>
            <button type="button" id="add-to-cart-button" th:attr="data-book-id=${book.id}">Add to Cart</button>
            <p id="add-to-cart-message" role="status"></p>
        </div>
    </article>
</main>
</body>
</html>
