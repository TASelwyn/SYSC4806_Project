
# Local development database configuration
# Uses an in-memory H2 database that runs with the application.
spring.datasource.url=jdbc:h2:mem:bookstoredb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Automatically update database tables based on JPA entities.
spring.jpa.hibernate.ddl-auto=update

# Enable the H2 web console for local development.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Display generated SQL for debugging.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Run SQL initialization scripts when the application starts.
spring.sql.init.mode=always

# Load the sample book records from our seed file.
spring.sql.init.data-locations=classpath:db/seed-books.sql

# Run the seed script after Hibernate creates the BOOKS table.
spring.jpa.defer-datasource-initialization=true
